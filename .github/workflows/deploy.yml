name: Deploy

# Vercel's GitHub integration auto-deploys to production on every push to main.
# This workflow exists purely to surface deployment status in the PR/commit UI
# and send a failure alert via the Vercel webhook.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  confirm-deploy:
    name: Confirm deploy triggered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deployment triggered
        run: |
          echo "✅ Push to main detected."
          echo "Vercel GitHub integration is deploying to https://www.linezheets.com"
          echo "Monitor at: https://vercel.com/linezheets/linezheets-platform"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
