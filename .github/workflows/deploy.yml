name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy-vercel:
    name: Deploy → Vercel (Production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    if: failure()
    steps:
      - name: Send failure email via SendGrid
        run: |
          curl -s -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "personalizations": [{"to": [{"email": "info@mxlla.com"}]}],
              "from": {"email": "alerts@linezheets.com", "name": "Linezheets CI"},
              "subject": "🚨 Deploy failed on main",
              "content": [{"type": "text/plain", "value": "The production deploy workflow failed. Check GitHub Actions: https://github.com/Linezheets/nextjs-with-supabase/actions"}]
            }'
