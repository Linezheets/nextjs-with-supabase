# ── Railway: Linezheets Full-stack (Next.js + Express API) ────────────────────
# This service builds the Next.js app via Dockerfile and runs the standalone server.

[build]
builder = "dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
